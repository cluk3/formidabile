packages:
  - apps/*
  - packages/*

catalogMode: prefer

catalog:
  "@axe-core/playwright": 4.14.0
  "@effect/platform-node": 4.0.5
  "@effect/sql-pg": 4.0.5
  "@effect/sql-pglite": 4.0.5
  "@electric-sql/pglite": 0.5.10
  "@fontsource-variable/inter": 5.3.0
  "@lucide/svelte": 1.60.0
  "@playwright/test": 1.64.1
  "@remix-run/node-fetch-server": 1.0.0
  "@sveltejs/adapter-static": 4.0.0
  "@sveltejs/kit": 3.1.0
  "@sveltejs/vite-plugin-svelte": 7.3.1
  "@tailwindcss/vite": 4.3.3
  "@types/node": 24.19.2
  "@vitest/browser-playwright": 5.0.5
  ajv: 8.20.0
  ajv-formats: 3.0.1
  bits-ui: 2.19.5
  cn: 0.5.0
  dependency-cruiser: 18.6.0
  drizzle-kit: 1.0.0-rc.5-5935859
  drizzle-orm: 1.0.0-rc.5-5935859
  effect: 4.0.5
  jose: 6.2.13
  openapi-fetch: 0.17.0
  openapi-typescript: 7.13.0
  playwright: 1.64.1
  shadcn-svelte: 1.7.0
  svelte: 5.57.2
  svelte-check: 4.7.7
  tailwind-variants: 3.3.1
  tailwindcss: 4.3.3
  tw-animate-css: 1.4.0
  typescript: 6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
  vitest-browser-svelte: 3.1.0
  zod: 4.6.7

allowBuilds:
  # drizzle-kit's esbuild finds its platform binary through optionalDependencies, so its install script isn't needed.
  esbuild: false

overrides:
  vite@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
    # Bits UI's runed declares an optional Kit 2 peer for `runed/kit`, which Bits UI never imports.
    "runed>@sveltejs/kit": "3"

minimumReleaseAgeExclude:
  - "@lucide/svelte@1.60.0"
  - jose@6.2.13
