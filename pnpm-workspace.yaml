packages:
  - apps/*
  - packages/*

catalogMode: prefer

catalog:
  "@effect/platform-node": 4.0.5
  "@effect/sql-pg": 4.0.5
  "@effect/sql-pglite": 4.0.5
  "@electric-sql/pglite": 0.5.10
  "@playwright/test": 1.64.1
  "@remix-run/node-fetch-server": 1.0.0
  "@sveltejs/adapter-static": 4.0.0
  "@sveltejs/kit": 3.1.0
  "@sveltejs/vite-plugin-svelte": 7.3.1
  "@tailwindcss/vite": 4.3.3
  "@types/node": 24.19.2
  "@vitest/browser-playwright": 5.0.5
  bits-ui: 2.19.5
  dependency-cruiser: 18.6.0
  drizzle-kit: 1.0.0-rc.5-5935859
  drizzle-orm: 1.0.0-rc.5-5935859
  effect: 4.0.5
  jose: 6.2.13
  openapi-fetch: 0.17.0
  openapi-typescript: 7.13.0
  playwright: 1.64.1
  svelte: 5.57.2
  svelte-check: 4.7.7
  tailwindcss: 4.3.3
  typescript: 6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
  vitest-browser-svelte: 3.1.0
  zod: 4.6.7

allowBuilds:
  # drizzle-kit's esbuild finds its platform binary through optionalDependencies, so its install script isn't needed.
  esbuild: false

overrides:
  vite@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
