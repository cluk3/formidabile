services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: formidabile
      POSTGRES_PASSWORD: formidabile
      POSTGRES_DB: formidabile
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formidabile -d formidabile"]
      interval: 1s
      timeout: 5s
      retries: 30
